<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation | Muhammad & Husaina</title>
    
    <!-- Fonts: Inter for clean UI, Fira Code for Tech data -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-base: #090e17;
            --bg-card: rgba(16, 24, 39, 0.85);
            --bg-panel: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8; /* Modern UI Blue */
            --accent-glow: rgba(56, 189, 248, 0.2);
        }

        body, html {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            height: 100%;
            line-height: 1.6;
        }

        /* Subtle UI Grid Background */
        .grid-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* Main Container */
        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
        }

        /* UI Card */
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
            backdrop-filter: blur(12px);
            width: 100%;
        }

        /* Header Section - CENTERED */
        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            font-family: 'Fira Code', monospace;
            font-size: 0.75em;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2.2em;
            font-weight: 300;
            margin: 5px 0;
            letter-spacing: 1px;
        }

        .ampersand {
            font-size: 1.5em;
            color: var(--accent);
            margin: 15px 0;
            font-family: 'Fira Code', monospace;
        }

        /* Data Panel Layout - Left Aligned for readability */
        .data-panel {
            background: var(--bg-panel);
            border-radius: 8px;
            padding: 30px;
            border-left: 4px solid var(--accent);
            margin-bottom: 30px;
        }

        .data-row {
            margin-bottom: 20px;
        }

        .data-row:last-child {
            margin-bottom: 0;
        }

        .data-label {
            font-family: 'Fira Code', monospace;
            font-size: 0.8em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }

        .data-value {
            font-size: 1.1em;
            font-weight: 400;
        }

        /* Interactive Map Container */
        .map-container {
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            height: 280px;
            width: 100%;
            position: relative;
        }

        /* Using your exact map coordinates */
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            filter: invert(90%) hue-rotate(180deg) contrast(1.1); /* Gives the map a cool dark-mode UI look */
        }

        /* Button Styles */
        .btn-calendar {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 6px;
            text-decoration: none;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn-calendar:hover {
            background: var(--accent);
            color: var(--bg-base);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .card { padding: 40px 20px; }
            .data-panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="grid-background"></div>

    <div class="container">
        <div class="card">
            
            <!-- Centered Header Section -->
            <div class="header-section">
                <div class="badge">SYS.INIT_UNION()</div>
                <h1>Muhammad Sanusi Waziri</h1>
                <div class="ampersand">&</div>
                <h1>Husaina Abubakar Runka</h1>
            </div>

            <!-- Tech UI Data Panel -->
            <div class="data-panel">
                <div class="data-row">
                    <span class="data-label">[ DATE_RECORD ]</span> 
                    <span class="data-value">Friday, 30th October 2026</span>
                </div>
                
                <div class="data-row">
                    <span class="data-label">[ TIMESTAMP ]</span> 
                    <span class="data-value">11:00 AM</span>
                </div>
                
                <div class="data-row">
                    <span class="data-label">[ SPATIAL_COORDINATES ]</span> 
                    <span class="data-value">
                        Masallacin Alhaji Sabo Zuciya,<br>
                        Near Central Market Roundabout, Kofar Kwaya, Katsina.
                    </span>
                    
                    <!-- Exact Google Map Provided by User -->
                    <div class="map-container">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3518.453063864158!2d7.5992907999999995!3d12.970751199999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x11b03b580aea7833%3A0x2fc4a20358873aac!2sKatsina%20Central%20Market!5e1!3m2!1sen!2sus!4v1787306682880!5m2!1sen!2sus" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="strict-origin-when-cross-origin">
                        </iframe>
                    </div>
                </div>
            </div>
            
            <!-- Calendar Integration -->
            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding:+Muhammad+&+Husaina&dates=20261030T100000Z/20261030T120000Z&details=Join+us+to+celebrate+the+union+of+Muhammad+Sanusi+Waziri+and+Husaina+Abubakar+Runka!&location=Katsina+Central+Market,+Katsina" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="btn-calendar">
                SYNC_TO_CALENDAR
            </a>

        </div>
    </div>

</body>
</html>
